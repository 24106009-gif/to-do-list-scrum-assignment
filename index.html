<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daymark | To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="intro">
      <p class="eyebrow">PERSONAL ORGANIZER</p>
      <h1>Make room for<br><em>what matters.</em></h1>
      <p class="subtitle">A focused place for today’s priorities, one clear step at a time.</p>
      <div class="date-line"><span class="status-dot"></span><span id="today"></span></div>
    </section>

    <section class="task-panel" aria-labelledby="task-heading">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">YOUR LIST</p>
          <h2 id="task-heading">Today’s tasks</h2>
        </div>
        <span class="task-count" id="task-count">0 open</span>
      </div>

      <form class="task-form" id="task-form">
        <label class="sr-only" for="task-input">Add a task</label>
        <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
        <button type="submit" aria-label="Add task">+</button>
      </form>

      <ul class="task-list" id="task-list"></ul>
      <p class="empty-state" id="empty-state">Your list is clear. Add the first task above.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
